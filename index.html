<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Rick and Morty | Personajes</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#17351d;background:radial-gradient(circle at 20% 20%,#efff9b,transparent 18%),linear-gradient(135deg,#10451f,#59bd30,#c8f45a);min-height:100vh}header{height:360px;display:grid;place-items:center;text-align:center;position:relative;overflow:hidden;border-bottom:6px solid #142b18;background-image:radial-gradient(circle,rgba(255,255,255,.8) 0 3px,transparent 4px);background-size:55px 55px}header:before{content:"";position:absolute;width:650px;height:650px;border-radius:50%;background:radial-gradient(circle,#f5ffb0 0 8%,#9deb3c 15% 30%,#39a82d 40% 52%,transparent 66%);animation:spin 12s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.hero{position:relative;z-index:2}.title{font-size:clamp(55px,10vw,105px);font-weight:1000;color:#8cf04a;-webkit-text-stroke:5px #182918;text-shadow:7px 7px #132015}.title span{color:#eaff83}.subtitle{display:inline-block;background:#17351d;color:#edff9b;padding:12px 22px;border-radius:30px;font-weight:bold;margin-top:10px}main{width:92%;max-width:1200px;margin:-45px auto 50px;position:relative;z-index:3}.toolbar{display:flex;gap:15px;align-items:center;background:#f5ffd9;border:4px solid #17351d;border-radius:20px;padding:15px;box-shadow:0 8px #17351d;margin-bottom:30px}input{flex:1;padding:14px;border:3px solid #55a737;border-radius:12px;font-size:16px;outline:0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:22px}.card{background:#f5ffd9;border:4px solid #17351d;border-radius:20px;overflow:hidden;cursor:pointer;box-shadow:0 7px #17351d;transition:.2s}.card:hover{transform:translateY(-7px) rotate(-1deg);box-shadow:0 13px #17351d}.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block}.info{text-align:center;padding:14px;font-weight:900;font-size:18px}.status{font-size:13px;margin-top:6px}.Alive{color:#269b35}.Dead{color:#c72c2c}.unknown{color:#777}.pages{display:flex;justify-content:center;gap:15px;margin-top:35px}button{border:3px solid #17351d;background:#eaff8b;color:#17351d;border-radius:12px;padding:11px 18px;font-weight:bold;cursor:pointer;box-shadow:0 4px #17351d}button:active{transform:translateY(3px);box-shadow:0 1px #17351d}button:disabled{opacity:.4;cursor:not-allowed}.modal{position:fixed;inset:0;background:#00190acc;backdrop-filter:blur(5px);display:none;place-items:center;padding:20px;z-index:10}.modal.show{display:grid}.box{width:min(800px,100%);max-height:90vh;overflow:auto;background:#f5ffd9;border:5px solid #17351d;border-radius:25px;box-shadow:0 12px #17351d;position:relative}.close{position:absolute;right:12px;top:12px;width:42px;height:42px;border-radius:50%;padding:0;font-size:23px;z-index:2}.modaltop{display:grid;grid-template-columns:280px 1fr;gap:25px;padding:30px;background:linear-gradient(135deg,#cfff62,#60bd37);border-bottom:4px solid #17351d}.modaltop img{width:100%;border:4px solid #17351d;border-radius:18px}.modaltop h2{font-size:40px;margin:10px 0}.badge{display:inline-block;background:#f5ffd9;border:2px solid #17351d;border-radius:20px;padding:7px 12px;font-weight:bold}.details{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:25px}.detail{background:#e5f5bd;border:2px solid #86b657;border-radius:13px;padding:13px}.detail strong{display:block;font-size:11px;text-transform:uppercase;opacity:.6;margin-bottom:5px}footer{text-align:center;padding:20px;font-weight:bold}@media(max-width:650px){.toolbar{flex-direction:column}.grid{grid-template-columns:repeat(2,1fr);gap:14px}.modaltop{grid-template-columns:1fr}.modaltop img{max-width:250px;margin:auto}.details{grid-template-columns:1fr}.title{font-size:55px}}
</style></head>
<body>
<header><div class="hero"><div class="title">Rick <span>&</span> Morty</div><div class="subtitle">EXPLORA LOS PERSONAJES DE OTRAS DIMENSIONES</div></div></header>
<main><div class="toolbar"><input id="search" placeholder="🔍 Buscar personaje..."><span id="count">Cargando...</span></div><section id="grid" class="grid"></section><div class="pages"><button id="prev">← Anterior</button><button id="next">Siguiente →</button></div></main>
<footer>Rick and Morty Character Explorer</footer>
<div id="modal" class="modal"><div class="box"><button class="close" id="close">×</button><div class="modaltop"><img id="mimg"><div><div class="badge" id="mstatus"></div><h2 id="mname"></h2><p>Información obtenida directamente de la Rick and Morty API.</p></div></div><div class="details"><div class="detail"><strong>Especie</strong><span id="mspecies"></span></div><div class="detail"><strong>Género</strong><span id="mgender"></span></div><div class="detail"><strong>Tipo</strong><span id="mtype"></span></div><div class="detail"><strong>Origen</strong><span id="morigin"></span></div><div class="detail"><strong>Última ubicación</strong><span id="mlocation"></span></div><div class="detail"><strong>Episodios</strong><span id="mepisodes"></span></div></div></div></div>
<script>
const API='https://rickandmortyapi.com/api/character';let characters=[],page=1,total=1;const $=id=>document.getElementById(id);const grid=$('grid');
async function load(p=1){grid.innerHTML='<p>🛸 Viajando entre dimensiones...</p>';try{let r=await fetch(`${API}?page=${p}`);let d=await r.json();characters=d.results;page=p;total=d.info.pages;render(characters);$('prev').disabled=page===1;$('next').disabled=page===total}catch(e){grid.innerHTML='<p>No se pudieron cargar los personajes.</p>'}}
function render(list){grid.innerHTML='';$('count').textContent=`${list.length} personajes`;if(!list.length){grid.innerHTML='<p>No encontramos ese personaje.</p>';return}list.forEach(c=>{let card=document.createElement('article');card.className='card';card.innerHTML=`<img src="${c.image}" alt="${c.name}"><div class="info">${c.name}<div class="status ${c.status}">● ${c.status}</div></div>`;card.onclick=()=>show(c);grid.appendChild(card)})}
function show(c){$('mimg').src=c.image;$('mname').textContent=c.name;$('mstatus').textContent='● '+c.status;$('mspecies').textContent=c.species||'Desconocido';$('mgender').textContent=c.gender||'Desconocido';$('mtype').textContent=c.type||'Sin tipo';$('morigin').textContent=c.origin.name;$('mlocation').textContent=c.location.name;$('mepisodes').textContent=c.episode.length;$('modal').classList.add('show');document.body.style.overflow='hidden'}
function hide(){$('modal').classList.remove('show');document.body.style.overflow=''}$('close').onclick=hide;$('modal').onclick=e=>{if(e.target===$('modal'))hide()};document.onkeydown=e=>{if(e.key==='Escape')hide()};$('search').oninput=e=>render(characters.filter(c=>c.name.toLowerCase().includes(e.target.value.toLowerCase())));$('prev').onclick=()=>{if(page>1){$('search').value='';load(page-1);scrollTo(0,0)}};$('next').onclick=()=>{if(page<total){$('search').value='';load(page+1);scrollTo(0,0)}};load();
</script></body></html>
